<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F4EE;
    --paper-raised:#FFFFFF;
    --ink:#1E2A32;
    --ink-soft:#5B6B72;
    --line:#DCD5C6;
    --brass:#A6803D;
    --brass-dark:#8A6A2E;
    --sage:#6E7F63;
    --danger:#B5493C;
    --radius:10px;
    --shadow:0 1px 2px rgba(30,42,50,0.06), 0 6px 20px rgba(30,42,50,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px);
    background-size: 100% 42px;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:36px 24px 80px;}

  header.top{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:20px;
    flex-wrap:wrap;
    margin-bottom:28px;
    padding-bottom:18px;
    border-bottom:2px solid var(--ink);
  }
  .title-block .eyebrow{
    font-size:11px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--brass-dark);
    font-weight:700;
    margin-bottom:4px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:36px;
    margin:0;
    letter-spacing:-0.01em;
  }
  .count{
    font-size:13px;
    color:var(--ink-soft);
    margin-top:4px;
  }

  .controls{
    display:flex;
    gap:12px;
    align-items:center;
  }
  .search-box{
    position:relative;
  }
  .search-box input{
    width:260px;
    padding:11px 14px 11px 38px;
    border-radius:999px;
    border:1.5px solid var(--line);
    background:var(--paper-raised);
    font-family:'Inter',sans-serif;
    font-size:14px;
    color:var(--ink);
    outline:none;
    transition:border-color .15s ease;
  }
  .search-box input:focus{border-color:var(--brass);}
  .search-box svg{
    position:absolute;
    left:13px;
    top:50%;
    transform:translateY(-50%);
    width:15px;height:15px;
    color:var(--ink-soft);
  }

  .add-btn{
    width:42px;height:42px;
    border-radius:50%;
    border:none;
    background:var(--ink);
    color:var(--paper);
    font-size:22px;
    line-height:1;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    box-shadow:var(--shadow);
    transition:transform .15s ease, background .15s ease;
  }
  .add-btn:hover{background:var(--brass-dark); transform:translateY(-1px);}
  .add-btn:active{transform:translateY(0);}

  .empty-state{
    text-align:center;
    padding:80px 20px;
    color:var(--ink-soft);
  }
  .empty-state .glyph{
    font-family:'Fraunces',serif;
    font-size:46px;
    color:var(--line);
    margin-bottom:10px;
  }
  .empty-state p{margin:4px 0; font-size:14px;}
  .empty-state .hint{font-size:13px; color:var(--ink-soft);}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(190px,1fr));
    gap:18px;
  }

  .card{
    position:relative;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px 14px 16px;
    text-align:center;
    cursor:pointer;
    box-shadow:var(--shadow);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .card:hover{transform:translateY(-3px); box-shadow:0 4px 6px rgba(30,42,50,0.08), 0 14px 28px rgba(30,42,50,0.1);}
  .card .tab{
    position:absolute;
    top:-9px; left:16px;
    background:var(--brass);
    color:#fff;
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:12px;
    width:22px;height:18px;
    border-radius:4px;
    display:flex;align-items:center;justify-content:center;
  }
  .avatar{
    width:76px;height:76px;
    border-radius:50%;
    margin:6px auto 12px;
    object-fit:cover;
    background:var(--paper);
    border:2px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Fraunces',serif;
    font-size:26px;
    color:var(--ink-soft);
  }
  .card .name{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:16px;
    margin:0;
    line-height:1.25;
    word-break:break-word;
  }
  .card .sub{
    font-size:11.5px;
    color:var(--ink-soft);
    margin-top:5px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .no-results{
    grid-column:1/-1;
    text-align:center;
    padding:50px 20px;
    color:var(--ink-soft);
    font-size:14px;
  }

  /* Modal shared */
  .overlay{
    position:fixed; inset:0;
    background:rgba(30,42,50,0.45);
    backdrop-filter:blur(2px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:100;
    opacity:0;
    pointer-events:none;
    transition:opacity .18s ease;
  }
  .overlay.open{opacity:1; pointer-events:auto;}
  .modal{
    background:var(--paper-raised);
    border-radius:14px;
    width:100%;
    max-width:440px;
    max-height:88vh;
    overflow-y:auto;
    box-shadow:0 20px 60px rgba(30,42,50,0.3);
    transform:translateY(10px) scale(.98);
    transition:transform .18s ease;
  }
  .overlay.open .modal{transform:translateY(0) scale(1);}
  .modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 22px 0;
  }
  .modal-head h2{
    font-family:'Fraunces',serif;
    font-size:20px;
    margin:0;
    font-weight:600;
  }
  .close-x{
    background:none;border:none;font-size:20px;cursor:pointer;color:var(--ink-soft);
    width:30px;height:30px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }
  .close-x:hover{background:var(--paper); color:var(--ink);}

  .modal-body{padding:18px 22px 24px;}

  /* Form */
  .photo-picker{
    display:flex;
    justify-content:center;
    margin-bottom:18px;
  }
  .photo-circle{
    width:96px;height:96px;
    border-radius:50%;
    border:2px dashed var(--line);
    background:var(--paper);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    cursor:pointer;
    overflow:hidden;
    position:relative;
    color:var(--ink-soft);
    transition:border-color .15s ease;
  }
  .photo-circle:hover{border-color:var(--brass);}
  .photo-circle img{width:100%;height:100%;object-fit:cover;}
  .photo-circle .plus{font-size:24px; line-height:1;}
  .photo-circle .label{font-size:9.5px; margin-top:2px; letter-spacing:.04em; text-transform:uppercase;}

  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:11.5px;
    font-weight:600;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .field input, .field textarea{
    width:100%;
    padding:10px 12px;
    border-radius:8px;
    border:1.5px solid var(--line);
    background:var(--paper);
    font-family:'Inter',sans-serif;
    font-size:14.5px;
    color:var(--ink);
    outline:none;
    transition:border-color .15s ease;
    resize:vertical;
  }
  .field input:focus, .field textarea:focus{border-color:var(--brass);}
  .field textarea{min-height:60px;}
  .req{color:var(--danger); font-weight:400;}

  .form-actions{
    display:flex;
    gap:10px;
    margin-top:20px;
  }
  .btn{
    flex:1;
    padding:11px 16px;
    border-radius:8px;
    border:none;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    transition:background .15s ease, opacity .15s ease;
  }
  .btn-primary{background:var(--ink); color:var(--paper);}
  .btn-primary:hover{background:var(--brass-dark);}
  .btn-ghost{background:transparent; color:var(--ink-soft); border:1.5px solid var(--line);}
  .btn-ghost:hover{background:var(--paper);}
  .btn-danger{background:transparent; color:var(--danger); border:1.5px solid var(--danger);}
  .btn-danger:hover{background:var(--danger); color:#fff;}

  .error-msg{
    color:var(--danger);
    font-size:12.5px;
    margin-top:-6px;
    margin-bottom:12px;
    display:none;
  }

  /* Profile view */
  .profile-view{text-align:center; padding:6px 22px 26px;}
  .profile-view .avatar-lg{
    width:120px;height:120px;
    border-radius:50%;
    object-fit:cover;
    margin:4px auto 14px;
    border:3px solid var(--paper);
    box-shadow:0 0 0 1px var(--line);
    background:var(--paper);
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;
    font-size:38px;
    color:var(--ink-soft);
  }
  .profile-view .pname{
    font-family:'Fraunces',serif;
    font-size:24px;
    font-weight:700;
    margin:0 0 18px;
  }
  .detail-row{
    text-align:left;
    padding:12px 0;
    border-top:1px solid var(--line);
  }
  .detail-row:first-of-type{border-top:1px solid var(--line);}
  .detail-row .dl{
    font-size:11px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--brass-dark);
    font-weight:700;
    margin-bottom:3px;
  }
  .detail-row .dv{
    font-size:14.5px;
    color:var(--ink);
    line-height:1.4;
    white-space:pre-wrap;
  }
  .profile-actions{
    display:flex;
    gap:10px;
    margin-top:20px;
  }

  @media (max-width:520px){
    .wrap{padding:22px 16px 60px;}
    h1{font-size:28px;}
    header.top{flex-direction:column; align-items:stretch;}
    .controls{justify-content:space-between;}
    .search-box input{width:100%;}
  }

  :focus-visible{outline:2px solid var(--brass); outline-offset:2px;}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="title-block">
      <div class="eyebrow">Personnel Records</div>
      <h1>Staff Register</h1>
      <div class="count" id="countLabel">0 profiles on file</div>
    </div>
    <div class="controls">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Search by name…" autocomplete="off">
      </div>
      <button class="add-btn" id="openAddBtn" title="Add profile" aria-label="Add profile">+</button>
    </div>
  </header>

  <div id="gridArea"></div>
</div>

<!-- Add/Edit Modal -->
<div class="overlay" id="formOverlay">
  <div class="modal">
    <div class="modal-head">
      <h2 id="formTitle">New Profile</h2>
      <button class="close-x" id="closeFormBtn">✕</button>
    </div>
    <div class="modal-body">
      <form id="profileForm">
        <input type="hidden" id="editId">
        <div class="photo-picker">
          <label class="photo-circle" id="photoCircle">
            <span class="plus" id="photoPlus">+</span>
            <span class="label" id="photoLabel">Photo</span>
            <img id="photoPreview" style="display:none;">
            <input type="file" accept="image/*" id="photoInput" style="display:none;">
          </label>
        </div>

        <div class="field">
          <label for="nameInput">Full name <span class="req">*</span></label>
          <input type="text" id="nameInput" placeholder="e.g. Rohan Mehta" required>
        </div>
        <div class="error-msg" id="nameError">Name is required.</div>

        <div class="field">
          <label for="addressInput">Address</label>
          <textarea id="addressInput" placeholder="Street, city, state"></textarea>
        </div>

        <div class="field">
          <label for="fatherInput">Father's name</label>
          <input type="text" id="fatherInput" placeholder="Father's name">
        </div>

        <div class="field">
          <label for="motherInput">Mother's name</label>
          <input type="text" id="motherInput" placeholder="Mother's name">
        </div>

        <div class="form-actions">
          <button type="button" class="btn btn-ghost" id="cancelFormBtn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">Save profile</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Profile View Modal -->
<div class="overlay" id="viewOverlay">
  <div class="modal">
    <div class="modal-head">
      <h2>Profile</h2>
      <button class="close-x" id="closeViewBtn">✕</button>
    </div>
    <div class="profile-view" id="profileViewBody"></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "staffRegisterProfiles";

  function loadProfiles(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){
      console.error("Could not read saved profiles:", e);
      return [];
    }
  }

  function saveProfiles(list){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
      return true;
    }catch(e){
      console.error("Could not save profiles:", e);
      alert("Sorry — your profile couldn't be saved. Your browser storage may be full or disabled.");
      return false;
    }
  }

  var profiles = loadProfiles();
  var currentPhotoData = null;
  var viewingId = null;

  var gridArea = document.getElementById("gridArea");
  var countLabel = document.getElementById("countLabel");
  var searchInput = document.getElementById("searchInput");

  var formOverlay = document.getElementById("formOverlay");
  var viewOverlay = document.getElementById("viewOverlay");
  var openAddBtn = document.getElementById("openAddBtn");
  var closeFormBtn = document.getElementById("closeFormBtn");
  var cancelFormBtn = document.getElementById("cancelFormBtn");
  var closeViewBtn = document.getElementById("closeViewBtn");
  var profileForm = document.getElementById("profileForm");
  var formTitle = document.getElementById("formTitle");
  var editIdField = document.getElementById("editId");
  var nameInput = document.getElementById("nameInput");
  var addressInput = document.getElementById("addressInput");
  var fatherInput = document.getElementById("fatherInput");
  var motherInput = document.getElementById("motherInput");
  var nameError = document.getElementById("nameError");
  var photoCircle = document.getElementById("photoCircle");
  var photoInput = document.getElementById("photoInput");
  var photoPreview = document.getElementById("photoPreview");
  var photoPlus = document.getElementById("photoPlus");
  var photoLabel = document.getElementById("photoLabel");
  var profileViewBody = document.getElementById("profileViewBody");

  function initials(name){
    var parts = name.trim().split(/\s+/).filter(Boolean);
    if(parts.length === 0) return "?";
    if(parts.length === 1) return parts[0].charAt(0).toUpperCase();
    return (parts[0].charAt(0) + parts[parts.length-1].charAt(0)).toUpperCase();
  }

  function escapeHtml(str){
    var div = document.createElement("div");
    div.textContent = str == null ? "" : str;
    return div.innerHTML;
  }

  function render(){
    var query = searchInput.value.trim().toLowerCase();
    var filtered = profiles.filter(function(p){
      return p.name.toLowerCase().indexOf(query) !== -1;
    });

    countLabel.textContent = profiles.length + (profiles.length === 1 ? " profile on file" : " profiles on file");

    if(profiles.length === 0){
      gridArea.innerHTML =
        '<div class="empty-state">' +
          '<div class="glyph">＋</div>' +
          '<p>No profiles yet.</p>' +
          '<p class="hint">Tap the + button above to add your first employee.</p>' +
        '</div>';
      return;
    }

    if(filtered.length === 0){
      gridArea.innerHTML = '<div class="grid"><div class="no-results">No one named "' + escapeHtml(searchInput.value.trim()) + '" found.</div></div>';
      return;
    }

    var html = '<div class="grid">';
    filtered.forEach(function(p){
      var avatarHtml = p.photo
        ? '<img class="avatar" src="' + p.photo + '" alt="">'
        : '<div class="avatar">' + initials(p.name) + '</div>';
      html +=
        '<div class="card" data-id="' + p.id + '">' +
          '<div class="tab">' + escapeHtml(initials(p.name).charAt(0)) + '</div>' +
          avatarHtml +
          '<p class="name">' + escapeHtml(p.name) + '</p>' +
          (p.address ? '<div class="sub">' + escapeHtml(p.address) + '</div>' : '') +
        '</div>';
    });
    html += '</div>';
    gridArea.innerHTML = html;

    Array.prototype.forEach.call(gridArea.querySelectorAll(".card"), function(card){
      card.addEventListener("click", function(){
        openView(card.getAttribute("data-id"));
      });
    });
  }

  function resetForm(){
    profileForm.reset();
    editIdField.value = "";
    currentPhotoData = null;
    photoPreview.style.display = "none";
    photoPreview.src = "";
    photoPlus.style.display = "block";
    photoLabel.style.display = "block";
    nameError.style.display = "none";
    nameInput.style.borderColor = "";
    formTitle.textContent = "New Profile";
    document.getElementById("saveBtn").textContent = "Save profile";
  }

  function openAddForm(){
    resetForm();
    openOverlay(formOverlay);
    setTimeout(function(){ nameInput.focus(); }, 50);
  }

  function openEditForm(id){
    var p = profiles.find(function(x){ return x.id === id; });
    if(!p) return;
    resetForm();
    formTitle.textContent = "Edit Profile";
    document.getElementById("saveBtn").textContent = "Save changes";
    editIdField.value = p.id;
    nameInput.value = p.name;
    addressInput.value = p.address || "";
    fatherInput.value = p.father || "";
    motherInput.value = p.mother || "";
    if(p.photo){
      currentPhotoData = p.photo;
      photoPreview.src = p.photo;
      photoPreview.style.display = "block";
      photoPlus.style.display = "none";
      photoLabel.style.display = "none";
    }
    closeOverlay(viewOverlay);
    openOverlay(formOverlay);
  }

  function openView(id){
    var p = profiles.find(function(x){ return x.id === id; });
    if(!p) return;
    viewingId = id;

    var avatarHtml = p.photo
      ? '<img class="avatar-lg" src="' + p.photo + '" alt="">'
      : '<div class="avatar-lg">' + initials(p.name) + '</div>';

    var rows = "";
    rows += '<div class="detail-row"><div class="dl">Address</div><div class="dv">' + (p.address ? escapeHtml(p.address) : '—') + '</div></div>';
    rows += '<div class="detail-row"><div class="dl">Father\'s name</div><div class="dv">' + (p.father ? escapeHtml(p.father) : '—') + '</div></div>';
    rows += '<div class="detail-row"><div class="dl">Mother\'s name</div><div class="dv">' + (p.mother ? escapeHtml(p.mother) : '—') + '</div></div>';

    profileViewBody.innerHTML =
      avatarHtml +
      '<p class="pname">' + escapeHtml(p.name) + '</p>' +
      rows +
      '<div class="profile-actions">' +
        '<button class="btn btn-ghost" id="editBtnInline">Edit</button>' +
        '<button class="btn btn-danger" id="deleteBtnInline">Delete</button>' +
      '</div>';

    document.getElementById("editBtnInline").addEventListener("click", function(){
      openEditForm(p.id);
    });
    document.getElementById("deleteBtnInline").addEventListener("click", function(){
      if(confirm('Remove "' + p.name + '" from the register? This cannot be undone.')){
        profiles = profiles.filter(function(x){ return x.id !== p.id; });
        saveProfiles(profiles);
        closeOverlay(viewOverlay);
        render();
      }
    });

    openOverlay(viewOverlay);
  }

  function openOverlay(el){
    el.style.display = "flex";
    requestAnimationFrame(function(){ el.classList.add("open"); });
    document.body.style.overflow = "hidden";
  }
  function closeOverlay(el){
    el.classList.remove("open");
    document.body.style.overflow = "";
    setTimeout(function(){ el.style.display = "none"; }, 180);
  }

  openAddBtn.addEventListener("click", openAddForm);
  closeFormBtn.addEventListener("click", function(){ closeOverlay(formOverlay); });
  cancelFormBtn.addEventListener("click", function(){ closeOverlay(formOverlay); });
  closeViewBtn.addEventListener("click", function(){ closeOverlay(viewOverlay); });

  [formOverlay, viewOverlay].forEach(function(ov){
    ov.addEventListener("click", function(e){
      if(e.target === ov) closeOverlay(ov);
    });
  });
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape"){
      closeOverlay(formOverlay);
      closeOverlay(viewOverlay);
    }
  });

  photoCircle.addEventListener("click", function(){ photoInput.click(); });
  photoInput.addEventListener("change", function(){
    var file = photoInput.files[0];
    if(!file) return;
    if(file.size > 3 * 1024 * 1024){
      alert("Please choose an image smaller than 3MB.");
      photoInput.value = "";
      return;
    }
    var reader = new FileReader();
    reader.onload = function(e){
      currentPhotoData = e.target.result;
      photoPreview.src = currentPhotoData;
      photoPreview.style.display = "block";
      photoPlus.style.display = "none";
      photoLabel.style.display = "none";
    };
    reader.readAsDataURL(file);
  });

  profileForm.addEventListener("submit", function(e){
    e.preventDefault();
    var name = nameInput.value.trim();
    if(!name){
      nameError.style.display = "block";
      nameInput.style.borderColor = "var(--danger)";
      nameInput.focus();
      return;
    }
    nameError.style.display = "none";
    nameInput.style.borderColor = "";

    var id = editIdField.value;
    var data = {
      id: id || (Date.now().toString(36) + Math.random().toString(36).slice(2,7)),
      name: name,
      address: addressInput.value.trim(),
      father: fatherInput.value.trim(),
      mother: motherInput.value.trim(),
      photo: currentPhotoData
    };

    if(id){
      var idx = profiles.findIndex(function(x){ return x.id === id; });
      if(idx !== -1) profiles[idx] = data;
    } else {
      profiles.push(data);
    }

    if(saveProfiles(profiles)){
      closeOverlay(formOverlay);
      render();
    }
  });

  searchInput.addEventListener("input", render);

  render();
})();
</script>
